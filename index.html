<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/atom-one-dark.css" integrity="sha512-ZxXw8g6k/2xt71jeit7rmStZ3yKUHFN8GnQjBpv00YXyn5zJX5ju0AI1EA3ccePshyhC/b9FWQXXc7bcOpST/A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown.min.css" integrity="sha512-Ouq1+UcR9ENXndFyd/YA9i+ETLJmX3WoaMBF/nDzdqJbipKGL/SAbkO+qjDoxfD/dhZs4ZqgR9vXkolrK77xmQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Edit-md</title>
</head>

<body>
    <nav class="navbar">
        <div class="logo">SyncMD</div>
        <div class="upload-download">
            <div class="upload">
                <i class="fa-solid fa-upload"></i>
            </div>
            <div class="download">
                <i class="fa-solid fa-download"></i>
            </div>
        </div>
    </nav>
    <main class="container">
        <section class="editor">
            <div class="toolbar">
                <p class="e-title">Editor</p>
                <div class="tools">
                    <button style="background: none;border: 0;"><i class="fa-solid fa-bold"></i></button>
                    <button style="background: none;border: 0;"><i class="fa-solid fa-strikethrough"></i></button>
                    <button style="background: none;border: 0;"><i class="fa-solid fa-link"></i></button>
                    <button style="background: none;border: 0;"><i class="fa-solid fa-list"></i></button>
                    <button style="background: none;border: 0;"><i class="fa-solid fa-list-ol"></i></button>
                    <button style="background: none;border: 0;"><i class="fa-solid fa-code"></i></button>
                    <button style="background: none;border: 0;"><i class="fa-solid fa-quote-left"></i></button>
                </div>

            </div>

            <textarea id="md-input" placeholder="Start writing markdown"></textarea>
        </section>

        <section class="preview">
            <div class="toolbar">
                <p class="e-title">Preview</p>
            </div>
            <div class="content markdown-body"><!-- Dynamically added --></div>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
        integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
